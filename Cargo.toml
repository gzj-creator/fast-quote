[workspace]
resolver = "2"
members = [
    "fastquote-core",
    "fastquote-hub",
    "fastquote-tdx",
    "fastquote-tencent",
    "fastquote-server",
    "fastquote-store",
    "fastquote-bin",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
redis = { version = "0.27", features = ["tokio-comp"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
bytes = "1"
nom = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
futures = "0.3"
encoding_rs = "0.8"
